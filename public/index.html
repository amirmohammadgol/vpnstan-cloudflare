<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vpnstan Cloudflare</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header><div><div class="brand">vpnstan</div><div class="muted">Cloudflare Edition · بدون Xray</div></div><span class="pill">VLESS / WebSocket</span></header><section class="hero"><h1>مدیریت کانفیگ‌ها</h1><p>ساخت کانفیگ VLESS با حجم و تاریخ انقضا؛ اجرا و نگهداری پنل روی Cloudflare Workers.</p></section><section class="card"><h2>ساخت کاربر</h2><div class="grid"><label>نام<input id="name" value="Client"></label><label>حجم (GB)<input id="quota" type="number" value="50" min="1"></label><label>اعتبار (روز)<input id="days" type="number" value="30" min="1"></label></div><button onclick="createClient()">ساخت کانفیگ</button><div id="msg"></div></section><section class="card"><div class="row"><h2>کاربران</h2><button class="ghost" onclick="loadClients()">بروزرسانی</button></div><div id="list" class="list"></div></section></main><script src="/app.js"></script></body></html>
